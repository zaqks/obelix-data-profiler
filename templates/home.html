<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Obelix Dataset Quality Profiler</title>

    <link rel="shortcut icon" href="/media/reports/assets/logo.png" />

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f8f9fa;
            min-height: 100vh;
            color: #495057;
            display: flex;
            flex-direction: column;
        }

        .app-container {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
        }

        .welcome-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            text-align: center;
        }

        .logo-section {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
        }

        .app-logo {
            width: 40px;
            height: 40px;
            background-image: url("/media/reports/assets/logo.png");
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
        }

        .welcome-text {
            font-size: 32px;
            font-weight: 300;
            color: #495057;
            margin: 0;
        }

        .welcome-subtitle {
            font-size: 16px;
            color: #6c757d;
            margin-top: 8px;
            max-width: 500px;
        }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: none;
            flex-direction: column;
            gap: 20px;
            min-height: 0;
        }

        .chat-messages.active {
            display: flex;
            height: 100vh;
        }

        .message {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            animation: fadeInUp 0.3s ease;
        }

        .message.user {
            flex-direction: row-reverse;
        }

        .message-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: white;
            flex-shrink: 0;
            font-size: 14px;
        }

        .message.bot .message-avatar {
            background-image: url("/media/reports/assets/logo.png");
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            background-color: #f8f9fa;
            border: 1px solid #dee2e6;
        }

        .message.user .message-avatar {
            background: white;
            border: 1px solid #007bff;
            color: #007bff;
        }

        .message-content {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 8px;
            line-height: 1.5;
            font-size: 14px;
        }

        .message.bot .message-content {
            background: white;
            color: #495057;
            border: 1px solid #e9ecef;
        }

        .message.user .message-content {
            background: #007bff;
            color: white;
        }

        .input-section {
            padding: 20px;
            border-top: 1px solid #e9ecef;
        }

        .input-container {
            position: relative;
            max-width: 600px;
            margin: 0 auto;
        }

        .main-input {
            width: 100%;
            background: white;
            border: 1px solid #dee2e6;
            border-radius: 24px;
            padding: 12px 50px 12px 20px;
            font-size: 16px;
            color: #495057;
            outline: none;
            transition: all 0.2s ease;
        }

        .main-input:focus {
            border-color: #007bff;
            box-shadow: 0 0 0 2px rgba(0, 123, 255, 0.1);
        }

        .main-input::placeholder {
            color: #6c757d;
        }

        .upload-trigger {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            background: #007bff;
            border: none;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            font-size: 18px;
            font-weight: bold;
            color: white;
        }

        .upload-trigger:hover {
            background: #0056b3;
        }

        .upload-trigger:disabled {
            background: #6c757d;
            cursor: not-allowed;
        }

        .file-input {
            display: none;
        }

        .results-container {
            background: white;
            border: 1px solid #e9ecef;
            border-radius: 6px;
            padding: 20px;
            margin: 12px 0;
        }

        .score-display {
            text-align: center;
            margin-bottom: 20px;
        }

        .score-circle {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 12px;
            font-size: 28px;
            font-weight: bold;
            color: white;
        }

        .score-label {
            font-size: 13px;
            color: #6c757d;
            font-weight: 500;
        }

        .suggestions-list {
            background: #f8f9fa;
            border-radius: 6px;
            padding: 16px;
            border: 1px solid #e9ecef;
        }

        .suggestions-title {
            font-size: 14px;
            font-weight: 600;
            color: #495057;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .suggestion-item {
            padding: 10px 12px;
            background: white;
            border-radius: 4px;
            margin-bottom: 6px;
            font-size: 13px;
            line-height: 1.4;
            border: 1px solid #e9ecef;
            border-left: 3px solid #007bff;
            color: #495057;
        }

        .view-details-btn {
            background: #007bff;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 6px;
            margin: 16px auto 0;
            text-decoration: none;
        }

        .view-details-btn:hover {
            background: #0056b3;
            transform: translateY(-1px);
        }

        .progress-indicator {
            background: white;
            border: 1px solid #e9ecef;
            border-radius: 8px;
            padding: 16px;
            margin: 12px 0;
        }

        .progress-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }

        .progress-spinner {
            width: 20px;
            height: 20px;
            border: 2px solid #e9ecef;
            border-top: 2px solid #007bff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        .progress-text {
            font-size: 14px;
            color: #495057;
            font-weight: 500;
        }

        .progress-details {
            font-size: 13px;
            color: #6c757d;
            line-height: 1.4;
        }

        .countdown-timer {
            font-size: 12px;
            color: #6c757d;
            margin-top: 8px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>
    <div class="app-container">
        <div class="welcome-section" id="welcomeSection">
            <div class="logo-section">
                <div class="app-logo"></div>
            </div>
            <h1 class="welcome-text">Hey there, I'm Obelix</h1>
            <p class="welcome-subtitle">Your Dataset Quality Assistant. I can analyze your CSV files and provide
                comprehensive quality insights with detailed reports.</p>
        </div>

        <div class="chat-messages" id="chatMessages">
        </div>

        <div class="input-section">
            <div class="input-container">
                <input type="text" class="main-input" id="mainInput" placeholder="Upload a CSV file to get started..."
                    readonly>
                <button class="upload-trigger" id="uploadTrigger">↑</button>
                <input type="file" id="fileInput" class="file-input" accept=".csv">
            </div>
        </div>
    </div>

    <script>
        const chatMessages = document.getElementById('chatMessages');
        const fileInput = document.getElementById('fileInput');
        const uploadTrigger = document.getElementById('uploadTrigger');
        const mainInput = document.getElementById('mainInput');
        const welcomeSection = document.getElementById('welcomeSection');

        let currentTaskId = null;
        let pollingInterval = null;
        let countdownTimer = null;
        let nextPollTime = 0;

        // Upload trigger click
        uploadTrigger.addEventListener('click', () => {
            if (!uploadTrigger.disabled) {
                fileInput.click();
            }
        });

        mainInput.addEventListener('click', () => {
            if (!uploadTrigger.disabled) {
                fileInput.click();
            }
        });

        // File input change
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFileUpload(e.target.files[0]);
            }
        });

        // Drag and drop on the whole page
        document.addEventListener('dragover', (e) => {
            e.preventDefault();
        });

        document.addEventListener('drop', (e) => {
            e.preventDefault();
            if (!uploadTrigger.disabled) {
                const files = e.dataTransfer.files;
                if (files.length > 0 && files[0].name.endsWith('.csv')) {
                    handleFileUpload(files[0]);
                }
            }
        });

        function showChatMode() {
            welcomeSection.classList.add('hidden');
            chatMessages.classList.add('active');
        }

        function disableUploads() {
            uploadTrigger.disabled = true;
            mainInput.placeholder = "Processing your file...";
        }

        function enableUploads() {
            uploadTrigger.disabled = false;
            mainInput.placeholder = "Upload another CSV file...";
        }

        function addMessage(content, isUser = false) {
            showChatMode();

            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isUser ? 'user' : 'bot'}`;

            const avatar = document.createElement('div');
            avatar.className = 'message-avatar';
            if (isUser) {
                avatar.textContent = '👤';
            }

            const messageContent = document.createElement('div');
            messageContent.className = 'message-content';
            messageContent.innerHTML = content;

            messageDiv.appendChild(avatar);
            messageDiv.appendChild(messageContent);

            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;

            return messageDiv;
        }

        function addProgressIndicator(filename) {
            const progressHtml = `
                <div class="progress-indicator" id="progressIndicator">
                    <div class="progress-header">
                        <div class="progress-spinner"></div>
                        <div class="progress-text">Processing ${filename}</div>
                    </div>
                    <div class="progress-details" id="progressDetails">
                        File uploaded successfully. Analysis starting...
                    </div>
                    <div class="countdown-timer" id="countdownTimer">
                        Next update in 30 seconds
                    </div>
                </div>
            `;
            return addMessage(progressHtml, false);
        }

        function updateProgressIndicator(message, showCountdown = true) {
            const progressDetails = document.getElementById('progressDetails');
            const countdownTimer = document.getElementById('countdownTimer');
            
            if (progressDetails) {
                progressDetails.textContent = message;
            }
            
            if (countdownTimer) {
                countdownTimer.style.display = showCountdown ? 'block' : 'none';
            }
        }

        function removeProgressIndicator() {
            const progressIndicator = document.getElementById('progressIndicator');
            if (progressIndicator) {
                progressIndicator.parentElement.remove();
            }
        }

        function startCountdown() {
            stopCountdown(); // Clear any existing countdown
            let seconds = 30;
            nextPollTime = Date.now() + 30000;
            
            countdownTimer = setInterval(() => {
                seconds--;
                const countdownElement = document.getElementById('countdownTimer');
                if (countdownElement && seconds > 0) {
                    countdownElement.textContent = `Next update in ${seconds} seconds`;
                } else if (countdownElement) {
                    countdownElement.textContent = `Next update in 30 seconds`;
                }
            }, 1000);
        }

        function stopCountdown() {
            if (countdownTimer) {
                clearInterval(countdownTimer);
                countdownTimer = null;
            }
        }

        function getScoreColor(score) {
            if (score >= 80) return '#28a745';
            if (score >= 60) return '#ffc107';
            return '#dc3545';
        }

        async function checkTaskStatus(taskId) {
            try {
                const response = await fetch(`/status/${taskId}/`);
                const result = await response.json();

                if (result.status === 'completed') {
                    // Task completed successfully
                    stopPolling();
                    removeProgressIndicator();
                    enableUploads();

                    const suggestionsHtml = result.suggestions.map(s =>
                        `<div class="suggestion-item">💡 ${s}</div>`
                    ).join('');

                    const resultsHtml = `
                        <div class="results-container">
                            <div class="score-display">
                                <div class="score-circle" style="background: ${getScoreColor(result.score)}">
                                    ${result.score.toFixed(1)}
                                </div>
                                <div class="score-label">Dataset Quality Score</div>
                            </div>
                            
                            <div class="suggestions-list">
                                <div class="suggestions-title">
                                    📋 Improvement Suggestions
                                </div>
                                ${suggestionsHtml}
                            </div>
                            
                            <a href="${result.report_url}" target="_blank" class="view-details-btn">
                                📊 View Detailed Report
                            </a>
                        </div>
                    `;

                    addMessage('🎉 Analysis complete! Here are your results:', false);
                    addMessage(resultsHtml, false);

                } else if (result.status === 'failed') {
                    // Task failed
                    stopPolling();
                    removeProgressIndicator();
                    enableUploads();
                    addMessage(`❌ Error: ${result.error}`, false);

                } else if (result.status === 'processing' || result.status === 'queued') {
                    // Task still in progress
                    const message = result.message || 'Processing your dataset...';
                    updateProgressIndicator(message);
                    startCountdown();
                }

            } catch (error) {
                console.error('Error checking status:', error);
                updateProgressIndicator('Connection error. Retrying...', true);
                startCountdown();
            }
        }

        function startPolling(taskId) {
            currentTaskId = taskId;
            
            // Check immediately
            checkTaskStatus(taskId);
            
            // Set up polling every 30 seconds
            pollingInterval = setInterval(() => {
                checkTaskStatus(taskId);
            }, 30000);
        }

        function stopPolling() {
            if (pollingInterval) {
                clearInterval(pollingInterval);
                pollingInterval = null;
            }
            stopCountdown();
            currentTaskId = null;
        }

        async function handleFileUpload(file) {
            if (!file.name.endsWith('.csv')) {
                addMessage('⚠️ Please upload a CSV file only.', false);
                return;
            }

            // Show user message
            addMessage(`📁 Uploaded: ${file.name}`, true);

            // Disable further uploads
            disableUploads();

            // Show progress indicator
            addProgressIndicator(file.name);

            const formData = new FormData();
            formData.append('dataset', file);

            try {
                const response = await fetch('/upload/', {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();

                if (result.success) {
                    // Start polling for status updates
                    updateProgressIndicator('Processing started. This may take several minutes...');
                    startPolling(result.task_id);
                } else {
                    removeProgressIndicator();
                    enableUploads();
                    addMessage(`❌ Error: ${result.error}`, false);
                }
            } catch (error) {
                removeProgressIndicator();
                enableUploads();
                addMessage('❌ Sorry, something went wrong. Please try again.', false);
            }
        }

        // Clean up on page unload
        window.addEventListener('beforeunload', () => {
            stopPolling();
        });
    </script>
</body>

</html>
